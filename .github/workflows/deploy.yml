name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Επιτρέπει σε ένα παράλληλο deploy να γίνει cancel+restart αν υπάρξει νέο push
concurrency:
  group: pages
  cancel-in-progress: true

# ΠΡΟΫΠΟΘΕΣΗ: στο repo πρέπει να είναι ενεργοποιημένα τα Pages με
# Source = "GitHub Actions" (Settings → Pages). Το GitHub δεν επιτρέπει
# στο workflow να δημιουργήσει μόνο του το Pages site.

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4